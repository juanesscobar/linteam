services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linteam}
      POSTGRES_USER: ${POSTGRES_USER:-linteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - linteam_dokploy_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LINTEAM_ENVIRONMENT: ${LINTEAM_ENVIRONMENT:-production}
      LINTEAM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-linteam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-linteam}
      LINTEAM_SECRET_KEY: ${LINTEAM_SECRET_KEY:?LINTEAM_SECRET_KEY is required}
      LINTEAM_BOOTSTRAP_TOKEN: ${LINTEAM_BOOTSTRAP_TOKEN:?LINTEAM_BOOTSTRAP_TOKEN is required}
      LINTEAM_WEBHOOK_SECRET: ${LINTEAM_WEBHOOK_SECRET:?LINTEAM_WEBHOOK_SECRET is required}
      LINTEAM_WHATSAPP_VERIFY_TOKEN: ${LINTEAM_WHATSAPP_VERIFY_TOKEN:-}
      LINTEAM_WHATSAPP_APP_SECRET: ${LINTEAM_WHATSAPP_APP_SECRET:-}
      LINTEAM_ALLOWED_ORIGINS: ${LINTEAM_ALLOWED_ORIGINS:?LINTEAM_ALLOWED_ORIGINS is required}
      LINTEAM_TRUSTED_HOSTS: ${LINTEAM_TRUSTED_HOSTS:?LINTEAM_TRUSTED_HOSTS is required}
      LINTEAM_FILE_STORAGE_PATH: /app/data/files
    expose:
      - "8000"
    volumes:
      - linteam_dokploy_files:/app/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  linteam_dokploy_db:
  linteam_dokploy_files:
