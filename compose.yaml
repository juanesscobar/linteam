services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linteam
      POSTGRES_USER: linteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-linteam-password}
    volumes:
      - linteam_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linteam -d linteam"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      LINTEAM_ENVIRONMENT: ${LINTEAM_ENVIRONMENT:-production}
      LINTEAM_DATABASE_URL: postgresql+psycopg://linteam:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/linteam
      LINTEAM_SECRET_KEY: ${LINTEAM_SECRET_KEY:?LINTEAM_SECRET_KEY is required}
      LINTEAM_BOOTSTRAP_TOKEN: ${LINTEAM_BOOTSTRAP_TOKEN:?LINTEAM_BOOTSTRAP_TOKEN is required}
      LINTEAM_WEBHOOK_SECRET: ${LINTEAM_WEBHOOK_SECRET:?LINTEAM_WEBHOOK_SECRET is required}
      LINTEAM_ALLOWED_ORIGINS: '["https://${LINTEAM_DOMAIN:?LINTEAM_DOMAIN is required}"]'
      LINTEAM_TRUSTED_HOSTS: '["${LINTEAM_DOMAIN}","app","localhost","127.0.0.1"]'
      LINTEAM_FILE_STORAGE_PATH: /app/data/files
    expose:
      - "8000"
    volumes:
      - linteam_files:/app/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      LINTEAM_DOMAIN: ${LINTEAM_DOMAIN:?LINTEAM_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  linteam_db:
  linteam_files:
  caddy_data:
  caddy_config:
